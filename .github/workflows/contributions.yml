name: update contributions card

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/contributions.py"
      - ".github/workflows/contributions.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: regenerate card
        run: python scripts/contributions.py --user mitsa-ng --out assets/contributions.svg --limit 8
        env:
          GH_TOKEN: ${{ github.token }}

      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          if git diff --cached --quiet; then
            echo "card unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "auto: refresh contributions card"
          git push
