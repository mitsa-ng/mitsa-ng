name: update profile panels

on:
  schedule:
    - cron: "16,46 * * * *" # every 30 min, offset from busy :00/:30
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/recent_prs.py"
      - "scripts/issue_pr_stats.py"
      - ".github/workflows/recent-prs.yml"

permissions:
  contents: write

concurrency:
  group: profile-panels
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # each script fetches once, then renders all languages and themes
      # (the Search API allows 30 authenticated calls/min)
      - name: Generate panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          user="${{ github.repository_owner }}"
          python3 scripts/recent_prs.py     --user "$user"
          python3 scripts/issue_pr_stats.py --user "$user"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "auto: refresh profile panels"
          git push
